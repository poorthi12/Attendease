[project]
name = "attendease"
version = "0.1.0"
description = "Student attendance management for students, teachers, and administrators"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "pymongo>=4.10,<5",
    "python-multipart>=0.0.18,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "httpx2>=2.16,<3", "mongomock>=4.3,<5", "pytest>=8.3,<9"]

[project.scripts]
attendease = "attendease:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.vercel]
entrypoint = "api.index:app"

